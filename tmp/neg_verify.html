<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P3-2a · VLM 4 类干扰物分类抽检工具</title>
<style>
:root{--bg:#0e1116;--card:#161b22;--line:#21262d;--ink:#e6edf3;--sub:#7d8590;--blue:#58a6ff;--green:#3fb950;--amber:#d29922;--red:#f85149;}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding:20px 24px}
h1{font-size:20px;margin:0 0 4px;color:var(--blue)}
.sub{color:var(--sub);font-size:12px;margin-bottom:16px}
.frame{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
.hd{display:flex;gap:12px;align-items:center;font-size:13px;margin-bottom:12px}
.idx{color:var(--blue);font-weight:700}
.rel{color:var(--ink);font-family:ui-monospace,Consolas,monospace}
.ts{color:var(--sub);font-size:11px;margin-left:auto}
img{width:100%;max-height:520px;object-fit:contain;background:#000;border-radius:6px;display:block}
.meta{margin:12px 0;font-size:13px}
.cats{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.badge{padding:2px 10px;border-radius:10px;font-size:12px;font-weight:600}
.raw{color:var(--sub);font-family:ui-monospace,Consolas,monospace;font-size:11px}
.actions{display:flex;gap:8px;margin-top:14px}
.actions button,.nav button{padding:8px 18px;border:1px solid var(--line);background:#21262d;color:var(--ink);border-radius:6px;cursor:pointer;font-size:13px;transition:all .12s}
.actions button.ok{border-color:var(--green)}.actions button.ok:hover,.actions button.ok.sel{background:rgba(63,185,80,.2);color:var(--green)}
.actions button.no{border-color:var(--red)}.actions button.no:hover,.actions button.no.sel{background:rgba(248,81,73,.2);color:var(--red)}
.actions button.dn{border-color:var(--amber)}.actions button.dn:hover,.actions button.dn.sel{background:rgba(210,153,34,.2);color:var(--amber)}
.actions button:hover{border-color:var(--blue)}
.nav{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.nav button:last-child{margin-left:auto;border-color:var(--blue);color:var(--blue)}
.nav button:hover{background:rgba(88,166,255,.15)}
.stats{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:12px;color:var(--sub);margin-bottom:12px;display:inline-block}
</style>
</head>
<body>
<div class="wrap">
<h1>P3-2a · VLM 4 类干扰物分类抽检</h1>
<p class="sub">数据源: /video/shujuji/datasets/v5_candidates/neg_classified.json (359 帧 Qwen2.5-VL-3B 分类结果) · 抽样策略: 每类 12 帧（none 5 帧）共 53 帧 · 持久化: localStorage</p>
<div class="stats" id="stats">加载中...</div>
<div id="content">加载中...</div>
</div>
<script src="neg_verify.js"></script>
</body>
</html>
