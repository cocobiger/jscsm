[general]
enableVhost=0
enableHls=1
enableMP4=0

[api]
apiDebug=1
apiDebugLog=1
apiPrefix=api
defaultSnap=./www/logo.png
downloadRoot=./www
; ⚠️ 下列 secret 为敏感密钥（GB28181 播放地址 ?secret= 引用同一值），请勿提交真实值。
; 部署时由运维从生产服务器 /opt/zlm/config.ini 同步，或通过密钥管理注入。
secret=__ZLM_API_SECRET__
snapRoot=./www/snap/

[http]
port=80
rootPath=/opt/media/bin/www

[rtp]
rtpPortRange=30000,30500

[rtsp]
port=554

[rtmp]
port=1935

[hls]
hlsPath=/opt/media/bin/www/hls
hlsSegDuration=2
hlsSegRetain=5

[websocket]
wsPort=8080

[cluster]
origin_url=
retry_count=3
timeout_sec=15

[ffmpeg]
bin=/usr/bin/ffmpeg
cmd=%s -re -i %s -c:a aac -strict -2 -ar 44100 -ab 48k -c:v libx264 -f flv %s
log=./ffmpeg/ffmpeg.log
restart_sec=0
snap=%s -i %s -y -f mjpeg -frames:v 1 -an %s
