server {
    listen 81;
    server_name _;

    absolute_redirect off;

    # === SkyMonitor (原有) ===
    location /qitijsc/ {
        alias /opt/skymonitor/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /qitijsc/index.html;
    }
    location /qitijsc/api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 司空媒体在线播放（dji-openapi :17810 视频字节流端点，签名 URL 鉴权，Range/206 透传）2026-08-28
    location /dji-video/ {
        proxy_pass http://127.0.0.1:17810/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        add_header Access-Control-Allow-Origin * always;
    }
    # JSC 离线地图瓦片（天地图万州预下载，静态，优先于下方 /tiles/ 代理匹配）
    location /tiles/vec_w/ {
        alias /opt/jsc/tiles/vec_w/;
        expires 30d;
        access_log off;
        add_header Cache-Control 'public, max-age=2592000, immutable' always;
    }
    location /tiles/cva_w/ {
        alias /opt/jsc/tiles/cva_w/;
        expires 30d;
        access_log off;
        add_header Cache-Control 'public, max-age=2592000, immutable' always;
    }
    location /tiles/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /qitijsc/ws {
        proxy_pass http://127.0.0.1:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # === JSC 驾驶舱 HLS 反代（从 uav-sites 复用，2026-07-09 补充） ===
    location ~ ^/jsc/([a-zA-Z0-9_-]+)/hls\.m3u8$ {
        proxy_pass http://127.0.0.1:6080/jsc/$1/hls.m3u8;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        add_header Access-Control-Allow-Origin * always;
    }
    location ~ ^/jsc/([a-zA-Z0-9_-]+)/(.+\.ts)$ {
        proxy_pass http://127.0.0.1:6080/jsc/$1/$2;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        add_header Access-Control-Allow-Origin * always;
    }
    location ~ ^/jsc_h264/([a-zA-Z0-9_-]+)/hls\.m3u8$ {
        proxy_pass http://127.0.0.1:6080/jsc_h264/$1/hls.m3u8;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        add_header Access-Control-Allow-Origin * always;
    }
    location ~ ^/jsc_h264/([a-zA-Z0-9_-]+)/(.+\.ts)$ {
        proxy_pass http://127.0.0.1:6080/jsc_h264/$1/$2;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        add_header Access-Control-Allow-Origin * always;
    }
    location ~ ^/jsc_h264/([a-zA-Z0-9_-]+)\.live\.flv$ {
        proxy_pass http://127.0.0.1:6080/jsc_h264/$1.live.flv;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        add_header Access-Control-Allow-Origin * always;
    }
    # === 模拟城运中心 (chengyun-mock) 2026-07-13 ===
    location /chengyun-mock/ {
        proxy_pass http://127.0.0.1:8088/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === 铁路巡护管理系统 (tielu) 路径挂载 :81 2026-07-14 ===
    location = /tielu {
        return 302 /tielu/;
    }
    location /tielu/ {
        alias /var/www/tielu/;
        index index.html;
        add_header Cache-Control 'no-cache' always;
        try_files $uri $uri/ /tielu/index.html;
    }
    location /tielu/assets/ {
        alias /var/www/tielu/assets/;
        expires 1y;
        add_header Cache-Control 'public, max-age=31536000, immutable' always;
        try_files $uri $uri/ =404;
    }
    # === 铁路巡护后端 API 反代（网关放行 /tielu/svc/ -> 后端 /api/）2026-07-14 ===
    location /tielu/svc/ {
        client_max_body_size 100m;  # tielu 媒体上传（与服务器实际生效值对齐）
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # === API 反代候选：挂在网关放行的 /tielu/assets/ 之下 (2026-07-14 探针) ===
    location /tielu/assets/bff/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
