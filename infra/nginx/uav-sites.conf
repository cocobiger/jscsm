server {
    listen 80;
    server_name _;

    absolute_redirect off;

    location = /admin {
        return 302 /admin/;
    }

    location = /dajiang {
        return 302 /dajiang/;
    }

    location /admin/ {
        alias /var/www/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    location /dajiang/ {
        alias /var/www/dajiang/;
        index index.html;
        try_files $uri $uri/ /dajiang/index.html;
    }

    # ===== JSC 驾驶舱系统 =====
    # ===== JSC HLS 流反代（ZLMediaKit .m3u8/.ts 分片） =====
    location ~ ^/jsc/([a-zA-Z0-9_-]+)/hls\.m3u8$ {
        proxy_pass http://127.0.0.1:6080/jsc/$1/hls.m3u8;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    location ~ ^/jsc/([a-zA-Z0-9_-]+)/(.+\.ts)$ {
        proxy_pass http://127.0.0.1:6080/jsc/$1/$2;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        if ($request_method = OPTIONS) { return 204; }
    }
    # ===== JSC H.265 转码流反代（ZLMediaKit jsc_h264 app） =====
    location ~ ^/jsc_h264/([a-zA-Z0-9_-]+)/hls\.m3u8$ {
        proxy_pass http://127.0.0.1:6080/jsc_h264/$1/hls.m3u8;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        if ($request_method = OPTIONS) { return 204; }
    }
    
    location ~ ^/jsc_h264/([a-zA-Z0-9_-]+)/(.+\.ts)$ {
        proxy_pass http://127.0.0.1:6080/jsc_h264/$1/$2;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        if ($request_method = OPTIONS) { return 204; }
    }
    
    location ~ ^/jsc_h264/([a-zA-Z0-9_-]+)\.live\.flv$ {
        proxy_pass http://127.0.0.1:6080/jsc_h264/$1.live.flv;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        if ($request_method = OPTIONS) { return 204; }
    }




    location /jsc/ {
        alias /opt/jsc/frontend/;
        index index.html;
        try_files $uri $uri/ /jsc/index.html;
        # SPA 入口：每次请求都向服务器校验（ETag 命中则 304），保证部署后即时生效
        add_header Cache-Control 'no-cache' always;
    }
    # SPA hash 资产：文件名带内容哈希，内容变则文件名变，可永久缓存
    location /jsc/assets/ {
        alias /opt/jsc/frontend/assets/;
        expires 1y;
        add_header Cache-Control 'public, max-age=31536000, immutable' always;
    }

    # JSC 视频流（ZLMediaKit FLV/HLS）反代
    location /jsc/live/ {
        proxy_pass http://127.0.0.1:6080/live/;
        proxy_http_version 1.1;

        # 关闭缓冲（流媒体实时性要求）
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        # 转发客户端真实信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # CORS（允许前端跨域播放）
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        if ($request_method = OPTIONS) { return 204; }

        # 超时（FLV 长时间拉流）
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # JSC 后端 API 代理
    location /jsc/api/ {
        proxy_pass http://127.0.0.1:7170/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # JSC 兼容路径（不带 /jsc 前缀的API请求，临时方案）
    location /api/ {
        proxy_pass http://127.0.0.1:7170/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 城运视频平台入站事件（/client/handle_event、/client/handle_event_other）
    location /client/ {
        proxy_pass http://127.0.0.1:7170/client/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }


    # ===== SkyMonitor 气体溯源系统（公网:81 实际映射到本机:80）=====
    # 前端 SPA
    location /qitijsc/ {
        alias /opt/skymonitor/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /qitijsc/index.html;
    }

    # 后端 API
    location /qitijsc/api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # JSC 离线地图瓦片（天地图万州预下载，vec_w/cva_w 层，更长前缀优先于下方 /tiles/ 代理匹配）
    location /tiles/vec_w/ {
        alias /opt/jsc/tiles/vec_w/;
        expires 30d;
        access_log off;
        add_header Cache-Control 'public, max-age=2592000, immutable' always;
    }
    location /tiles/cva_w/ {
        alias /opt/jsc/tiles/cva_w/;
        expires 30d;
        access_log off;
        add_header Cache-Control 'public, max-age=2592000, immutable' always;
    }

    # 地图瓦片代理（SkyMonitor qitijsc 用，层名无 _w 后缀，与上方 JSC 静态瓦片不冲突）
    location /tiles/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location /qitijsc/ws {
        proxy_pass http://127.0.0.1:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # === 模拟城运中心 (chengyun-mock) 2026-07-13 ===
    location /chengyun-mock/ {
        proxy_pass http://127.0.0.1:8088/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === 铁路巡护管理系统 (tielu) 路径挂载 2026-07-14 ===
    location = /tielu {
        return 302 /tielu/;
    }
    location /tielu/ {
        alias /var/www/tielu/;
        index index.html;
        try_files $uri $uri/ /tielu/index.html;
    }    # === 铁路巡护后端 API 反代（网关把 :81/tielu/ 转发到本机 :80，故 :80 块也需补齐）2026-07-14 ===
    location /tielu/svc/ {
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}
